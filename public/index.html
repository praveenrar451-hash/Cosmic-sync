<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Sync - Our Universe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050515;
            color: #e0e0ff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Cosmic Starry Background Animation */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: -1;
        }
        header {
            text-align: center;
            padding: 15px;
            background: rgba(15, 15, 35, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #ffb7ff;
            text-shadow: 0 0 10px rgba(255, 183, 255, 0.5);
        }
        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .chat-section, .canvas-section {
            background: rgba(25, 25, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            backdrop-filter: blur(5px);
        }
        h3 {
            margin-bottom: 10px;
            color: #8be9fd;
            font-size: 1.1rem;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(10, 10, 20, 0.5);
        }
        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(139, 233, 253, 0.1);
            border-left: 3px solid #8be9fd;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }
        input { flex: 1; }
        button {
            background: #ff79c6;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #ff92d0; }
        
        /* Canvas Styling */
        #cosmicCanvas {
            flex: 1;
            background: rgba(5, 5, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: crosshair;
        }
        .canvas-controls {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <header>🌌 Cosmic Sync - Our Private Universe 🌌</header>

    <div class="container">
        <!-- Live Chat Section -->
        <div class="chat-section">
            <h3>Stardust Messages</h3>
            <div id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="nameInput" placeholder="Your Name" style="max-width: 100px;">
                <input type="text" id="messageInput" placeholder="Send a cosmic message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- Shared Canvas Section -->
        <div class="canvas-section">
            <h3>Shared Constellation Canvas</h3>
            <canvas id="cosmicCanvas"></canvas>
            <div class="canvas-controls">
                <span style="font-size: 0.85rem; color: #aaa;">Draw together in real-time</span>
                <button onclick="clearCanvas()" style="background: #ff5555; padding: 5px 10px; font-size: 0.8rem;">Clear Canvas</button>
            </div>
        </div>
    </div>

    <!-- Socket.io Client Library -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Chat Logic
        function sendMessage() {
            const name = document.getElementById('nameInput').value || 'Anonymous';
            const message = document.getElementById('messageInput').value;
            if (message.trim() !== '') {
                socket.emit('cosmic-message', { name, message });
                document.getElementById('messageInput').value = '';
            }
        }

        socket.on('cosmic-message', (data) => {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<strong>${data.name}:</strong> ${data.message}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Drawing Logic
        const canvas = document.getElementById('cosmicCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let painting = false;

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        function startPosition(e) {
            painting = true;
            draw(e);
        }
        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#ff79c6';

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

            // Send draw coordinates to partner
            socket.emit('draw-action', { x, y, start: false });
        }

        socket.on('draw-action', (data) => {
            // Render partner's drawing
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#8be9fd';
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(data.x, data.y);
        });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
